name: PDF report

on:
  workflow_dispatch:
    inputs:
      top:
        description: "Top-scoring stocks per market"
        required: false
        default: "18"

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python pdf_report.py --top ${{ github.event.inputs.top }}
      - name: Save the PDF
        run: |
          git config user.name "quality-momentum-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -f reports/top-stocks-*.pdf
          git diff --cached --quiet || (git commit -m "PDF report $(date -u +%F)" && (for i in 1 2 3; do git pull --rebase && git push && break; sleep 10; done))
