name: Momentum PDF

on:
  workflow_dispatch:
    inputs:
      top:
        description: "Stocks per section"
        required: false
        default: "5"

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt matplotlib
      - run: python momentum_pdf.py --top ${{ github.event.inputs.top }}
      - name: Save PDF
        run: |
          git config user.name "quality-momentum-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/momentum
          git diff --cached --quiet || (git commit -m "Momentum PDF $(date -u +%F)" && (for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done))
