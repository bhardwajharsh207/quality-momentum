name: India scan

on:
  schedule:
    # 01:32-05:32 UTC = 7:02-11:02 AM IST on weekdays. Backup only: GitHub often delays or drops
    # scheduled runs, so the Claude scheduled task also starts this workflow at :40 each hour 7-11 AM IST.
    # No time-window gate: a run skips sessions already processed and ignores the unfinished bar.
    - cron: "32 1-5 * * 1-5"
    # Main attempts: hourly after the NSE close, 4:47-11:47 PM IST (11:17-18:17 UTC). Several slots
    # because GitHub drops many scheduled runs; extra ones exit in seconds once the session is done.
    - cron: "17 11-18 * * 1-5"
  workflow_dispatch:
    inputs:
      args:
        description: "Extra arguments, e.g. --rebuild or --force"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: india-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run scan
        shell: bash
        run: |
          mkdir -p logs
          set -o pipefail
          {
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python india_scan.py ${{ github.event.inputs.args }}
          else
            python india_scan.py
          fi
          } 2>&1 | tee logs/india-latest.log
      - name: Write results to the Google Sheet
        if: success()
        continue-on-error: true
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: python sheet_sync.py india
      - name: Save reports and state
        if: always()
        run: |
          git config user.name "quality-momentum-bot"
          git config user.email "actions@users.noreply.github.com"
          python export_site.py || true
          git add docs data/india reports/india 2>/dev/null || true
          if [ -s logs/india-latest.log ] && ! grep -q '^No new session' logs/india-latest.log; then git add -f logs/india-latest.log; fi
          git diff --cached --quiet || (git commit -m "India scan $(date -u +%F)" && git pull --rebase --autostash && git push)
