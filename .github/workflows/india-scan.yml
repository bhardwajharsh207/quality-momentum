name: India scan

on:
  schedule:
    # 01:32-05:32 UTC = 7:02-11:02 AM IST on weekdays (India has no daylight saving).
    - cron: "32 1-5 * * 1-5"
  workflow_dispatch:
    inputs:
      args:
        description: "Extra arguments, e.g. --rebuild or --force"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: india-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run scan
        shell: bash
        run: |
          mkdir -p logs
          set -o pipefail
          {
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python india_scan.py ${{ github.event.inputs.args }}
          else
            python india_scan.py --hours 7-11 --hours-tz Asia/Kolkata
          fi
          } 2>&1 | tee logs/india-latest.log
      - name: Save reports and state
        if: always()
        run: |
          git config user.name "quality-momentum-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/india reports/india 2>/dev/null || true
          if [ -s logs/india-latest.log ] && ! grep -q '^No new session' logs/india-latest.log; then git add logs/india-latest.log; fi
          git diff --cached --quiet || (git commit -m "India scan $(date -u +%F)" && git pull --rebase && git push)
