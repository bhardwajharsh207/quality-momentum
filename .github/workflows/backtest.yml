name: Backtest

on:
  workflow_dispatch:
    inputs:
      months:
        description: "Months to replay"
        required: false
        default: "12"
      variants:
        description: "Comma-free JSON list of variants"
        required: false
        default: '["current"]'

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        market: [india, us]
        variant: ${{ fromJSON(github.event.inputs.variants || '["current"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python backtest.py ${{ matrix.market }} --months ${{ github.event.inputs.months }} --variant ${{ matrix.variant }}
      - name: Save results
        run: |
          git config user.name "quality-momentum-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backtest/${{ matrix.market }}
          git diff --cached --quiet || (git commit -m "Backtest ${{ matrix.market }} ${{ matrix.variant }} $(date -u +%F)" && (for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep 10; done))
