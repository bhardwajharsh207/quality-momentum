name: Backtest

on:
  workflow_dispatch:
    inputs:
      months:
        description: "Months to replay"
        required: false
        default: "12"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        market: [india, us]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python backtest.py ${{ matrix.market }} --months ${{ github.event.inputs.months }}
      - name: Save results
        run: |
          git config user.name "quality-momentum-bot"
          git config user.email "actions@users.noreply.github.com"
          git add backtest/${{ matrix.market }}
          git diff --cached --quiet || (git commit -m "Backtest ${{ matrix.market }} $(date -u +%F)" && git pull --rebase && git push)
