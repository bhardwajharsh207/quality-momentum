name: US scan

on:
  schedule:
    # Hourly on weekdays across 14:00-19:59 UTC; the script itself only runs at 7-11 AM Pacific,
    # so this stays correct through daylight-saving changes.
    - cron: "2 14-19 * * 1-5"
  workflow_dispatch:
    inputs:
      args:
        description: "Extra arguments, e.g. --rebuild or --force"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: us-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run scan
        shell: bash
        run: |
          mkdir -p logs
          set -o pipefail
          {
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python us_scan.py ${{ github.event.inputs.args }}
          else
            python us_scan.py --hours 7-11 --hours-tz America/Los_Angeles
          fi
          } 2>&1 | tee logs/us-latest.log
      - name: Save reports and state
        if: always()
        run: |
          git config user.name "quality-momentum-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/us reports/us 2>/dev/null || true
          if [ -s logs/us-latest.log ] && ! grep -q '^No new session' logs/us-latest.log; then git add logs/us-latest.log; fi
          git diff --cached --quiet || (git commit -m "US scan $(date -u +%F)" && git pull --rebase && git push)
