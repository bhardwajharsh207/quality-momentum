name: US scan

on:
  schedule:
    # Hourly on weekdays 14:02-19:02 UTC. Backup only: GitHub often delays or drops scheduled runs,
    # so the Claude scheduled task also starts this workflow at :40 each hour 7-11 AM Pacific.
    # No time-window gate: a run skips sessions already processed and ignores the unfinished bar.
    - cron: "2 14-19 * * 1-5"
    # Main attempts: hourly after the US close, 21:17-04:17 UTC (about 2-9 PM Pacific), Mon-Fri sessions.
    # Several slots because GitHub drops many scheduled runs; extra ones exit in seconds once done.
    - cron: "17 21-23 * * 1-5"
    - cron: "17 0-4 * * 2-6"
  workflow_dispatch:
    inputs:
      args:
        description: "Extra arguments, e.g. --rebuild or --force"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: us-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run scan
        shell: bash
        run: |
          mkdir -p logs
          set -o pipefail
          {
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python us_scan.py ${{ github.event.inputs.args }}
          else
            python us_scan.py
          fi
          } 2>&1 | tee logs/us-latest.log
      - name: Write results to the Google Sheet
        if: success()
        continue-on-error: true
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
        run: python sheet_sync.py us
      - name: Momentum PDF and email (new session only)
        if: success()
        continue-on-error: true
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          if [ -n "$(git status --porcelain data/us/sheet_rows)" ] || [ "${{ github.event.inputs.args }}" = "--pdf" ]; then
            pip install -q matplotlib
            python momentum_pdf.py
            python send_pdf_email.py
          else
            echo "No new US session; no PDF or email."
          fi
      - name: Save reports and state
        if: always()
        run: |
          git config user.name "quality-momentum-bot"
          git config user.email "actions@users.noreply.github.com"
          python export_site.py || true
          git add docs data/us reports/us reports/momentum 2>/dev/null || true
          if [ -s logs/us-latest.log ] && ! grep -q '^No new session' logs/us-latest.log; then git add -f logs/us-latest.log; fi
          # Re-running a scan for the same session rewrites the same dated files, so a plain
          # rebase hits add/add conflicts: -X theirs keeps this run's fresh output. Retry covers
          # the push race when the India and US jobs finish together.
          if ! git diff --cached --quiet; then
            git commit -m "US scan $(date -u +%F)"
            for i in 1 2 3; do
              git pull --rebase --autostash -X theirs && git push && break
              echo "save attempt $i failed; retrying"; sleep $((RANDOM % 10 + 5))
            done
          fi
